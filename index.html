<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://127.0.0.1:3000">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriTrack — Launch App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #064e3b 0%, #091724 60%, #020617 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .launcher-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 44px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), 0 0 40px rgba(16, 185, 129, 0.15);
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
      animation: gentle-pulse 2.5s infinite ease-in-out;
    }
    @keyframes gentle-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 16px 40px rgba(16, 185, 129, 0.6); }
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #34d399;
      margin-bottom: 20px;
    }
    .status-text {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .launch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      border-radius: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }
    .launch-btn:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
    }
    .server-note {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }
    .server-note code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
      color: #38bdf8;
      font-size: 11px;
    }
  </style>
  <script>
    // Immediate auto-redirect
    window.location.replace("http://127.0.0.1:3000");
  </script>
</head>
<body>
  <div class="launcher-card">
    <div class="logo-badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
      </svg>
    </div>
    <h1>NutriTrack</h1>
    <div class="tagline">Personal Nutrition & Fitness</div>
    <p class="status-text">Redirecting you directly to the application...</p>
    
    <a href="http://127.0.0.1:3000" class="launch-btn" id="openLink">
      <span>Open NutriTrack Now</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>

    <div class="server-note">
      Tip: If your app hasn't started yet, double-click <code>Start-NutriTrack.bat</code> in this folder to launch the server and open automatically.
    </div>
  </div>
</body>
</html>
